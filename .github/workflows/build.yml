name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install launcher PNGs from embedded base64
        run: |
          chmod +x scripts/install-icons.sh
          ./scripts/install-icons.sh

      - name: Download arm64 fastboot into jniLibs (executable path)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/jniLibs/arm64-v8a/libfastboot.so \
            "https://github.com/rendiix/termux-adb-fastboot/raw/master/binary/arm64-v8a/bin/fastboot"
          cp app/src/main/jniLibs/arm64-v8a/libfastboot.so app/src/main/assets/fastboot
          chmod +x app/src/main/jniLibs/arm64-v8a/libfastboot.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/res/mipmap-*/ic_launcher.png || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastTool-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
