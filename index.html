<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <title>FastTool — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Roboto+Flex:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121212;
      --surface: #161616;
      --surface-2: #1A1A1A;
      --surface-3: #1E1E1E;
      --text: #ECECEC;
      --text-muted: #767676;
      --text-dim: #5C5C5C;
      --text-faint: #4A4A4A;
      --accent: #E4E4E4;
      --radius-xl: 28px;
      --radius-full: 999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: var(--text);
      font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 16px;
    }

    /* Phone frame */
    .device {
      width: 100%;
      max-width: 390px;
      height: min(844px, 100dvh - 32px);
      background: var(--bg);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 25px 50px -12px rgba(0,0,0,0.6);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 20px 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #767676;
      transition: background 0.3s ease;
    }

    .status-dot.ready {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
    }

    .status-dot.busy {
      background: #facc15;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.35);
    }

    .status-text {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .action-btn {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      background: #2a2a2a;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    /* Terminal panel */
    .terminal {
      flex: 1;
      margin: 4px 20px 16px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 22px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
    }

    .terminal::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .output {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line.system {
      color: var(--text-dim);
      font-size: 12px;
    }

    .line.cmd {
      color: var(--text);
    }

    .line.cmd .prompt {
      color: var(--text);
      margin-right: 6px;
    }

    .line.out {
      color: #b0b0b0;
    }

    .line.err {
      color: #f87171;
    }

    .line.ok {
      color: #4ade80;
    }

    .cursor-line {
      margin-top: 4px;
    }

    .cursor-line .prompt {
      color: var(--text);
    }

    .cursor {
      color: var(--text-faint);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Command bar */
    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0 20px 28px;
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      height: 52px;
      background: var(--surface-2);
      border-radius: 26px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .input-wrap input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
    }

    .input-wrap input::placeholder {
      color: #555;
    }

    .run-btn {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #161616;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .run-btn:hover {
      opacity: 0.92;
    }

    .run-btn:active {
      transform: scale(0.94);
    }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Desktop / larger screens */
    @media (min-width: 480px) {
      body {
        background: #050505;
      }
    }
  </style>
</head>
<body>
  <div class="device" role="application" aria-label="FastTool Terminal">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>FastTool</h1>
        <div class="status">
          <span class="status-dot ready" id="statusDot" aria-hidden="true"></span>
          <span class="status-text" id="statusText">OTG host · ready</span>
        </div>
      </div>

      <button class="action-btn" id="templatesBtn" aria-label="Install template / profiles" title="Templates">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"></path>
          <path d="M7 10l5 5 5-5"></path>
          <path d="M5 21h14"></path>
        </svg>
      </button>
    </header>

    <!-- Terminal -->
    <div class="terminal" id="terminal" aria-live="polite">
      <div class="output" id="output">
        <div class="line system">Session idle — waiting for a command</div>
      </div>
      <div class="cursor-line">
        <span class="prompt">$</span> <span class="cursor">_</span>
      </div>
    </div>

    <!-- Command bar -->
    <div class="bar">
      <label for="cmd" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Command</label>
      <div class="input-wrap">
        <input id="cmd" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
      </div>
      <button class="run-btn" id="runBtn" aria-label="Run command" title="Run">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      const outputEl = document.getElementById('output');
      const terminalEl = document.getElementById('terminal');
      const cmdInput = document.getElementById('cmd');
      const runBtn = document.getElementById('runBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const templatesBtn = document.getElementById('templatesBtn');

      let history = [];
      let histIndex = -1;
      let isBusy = false;

      function scrollToBottom() {
        terminalEl.scrollTop = terminalEl.scrollHeight;
      }

      function addLine(text, className = 'out') {
        const div = document.createElement('div');
        div.className = 'line ' + className;
        div.textContent = text;
        outputEl.appendChild(div);
        scrollToBottom();
      }

      function addHtml(html, className = 'out') {
        const div = document.createElement('div');
        div.className = 'line ' + className;
        div.innerHTML = html;
        outputEl.appendChild(div);
        scrollToBottom();
      }

      function setStatus(state, text) {
        statusDot.className = 'status-dot ' + state;
        statusText.textContent = text;
      }

      function setBusy(busy) {
        isBusy = busy;
        runBtn.disabled = busy;
        cmdInput.disabled = busy;
        if (busy) {
          setStatus('busy', 'OTG host · working…');
        } else {
          setStatus('ready', 'OTG host · ready');
        }
      }

      // Simulated command handlers
      const commands = {
        help() {
          addLine('FastTool — available commands', 'system');
          addLine('');
          addLine('  help          Show this help');
          addLine('  status        Show OTG / host status');
          addLine('  devices       List connected devices');
          addLine('  otg           OTG host information');
          addLine('  clear         Clear the terminal');
          addLine('  version       Show FastTool version');
          addLine('  echo <text>   Echo text back');
          addLine('');
          addLine('More commands will appear as backends are connected.', 'system');
        },

        status() {
          addLine('Host status', 'system');
          addLine('  Mode          OTG host');
          addLine('  State         ready');
          addLine('  Backend       browser (simulated)');
          addLine('  Permissions   WebUSB / ADB not yet linked');
          addLine('  Uptime        ' + Math.floor(performance.now() / 1000) + 's');
        },

        devices() {
          addLine('Scanning for devices…', 'system');
          return new Promise(resolve => {
            setTimeout(() => {
              addLine('No devices detected (simulation).', 'out');
              addLine('Connect a device over OTG and grant access when prompted.', 'system');
              resolve();
            }, 700);
          });
        },

        otg() {
          addLine('OTG Host', 'system');
          addLine('  Role          host');
          addLine('  USB           ready');
          addLine('  Power         on');
          addLine('  Protocol      USB 2.0 / 3.x (host)');
          addLine('');
          addLine('This UI is prepared for real WebUSB or native bridge integration.', 'system');
        },

        clear() {
          outputEl.innerHTML = '';
          addLine('Session cleared', 'system');
        },

        version() {
          addLine('FastTool 0.1.0');
          addLine('Terminal UI — interactive concept made real');
          addLine('https://github.com/Classity-Real/FastTool');
        },

        echo(args) {
          addLine(args.join(' ') || '');
        }
      };

      async function runCommand(raw) {
        const line = raw.trim();
        if (!line) return;

        // Echo the command
        addHtml('<span class="prompt">$</span> ' + escapeHtml(line), 'cmd');

        history.push(line);
        histIndex = history.length;

        const parts = line.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        setBusy(true);

        try {
          if (commands[cmd]) {
            const result = commands[cmd](args);
            if (result && typeof result.then === 'function') {
              await result;
            }
          } else {
            addLine('Unknown command: ' + cmd, 'err');
            addLine('Type "help" for available commands.', 'system');
          }
        } catch (e) {
          addLine('Error: ' + (e.message || e), 'err');
        } finally {
          setBusy(false);
          cmdInput.focus();
        }
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Event listeners
      runBtn.addEventListener('click', () => {
        const val = cmdInput.value;
        cmdInput.value = '';
        runCommand(val);
      });

      cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = cmdInput.value;
          cmdInput.value = '';
          runCommand(val);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (histIndex > 0) {
            histIndex--;
            cmdInput.value = history[histIndex] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (histIndex < history.length - 1) {
            histIndex++;
            cmdInput.value = history[histIndex] || '';
          } else {
            histIndex = history.length;
            cmdInput.value = '';
          }
        }
      });

      templatesBtn.addEventListener('click', () => {
        addLine('Templates / profiles are not implemented yet.', 'system');
        addLine('This button is reserved for installing device profiles and command packs.', 'system');
        cmdInput.focus();
      });

      // Focus input on load / click terminal
      cmdInput.focus();
      terminalEl.addEventListener('click', () => cmdInput.focus());

      // Welcome hint after a moment
      setTimeout(() => {
        if (outputEl.children.length === 1) {
          addLine('Type "help" to get started.', 'system');
        }
      }, 1800);
    })();
  </script>
</body>
</html>
